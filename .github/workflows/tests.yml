name: Tests

on:
  push:
  pull_request:

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m py_compile agent.py pipeline.py hadoop_worker.py iteration2.py streamlit_app.py
      - name: Test without private data or API key
        run: python -m pytest -q
